<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Qsina · Offline</title>
<style>
  html,body{margin:0;background:#f7f6f2;color:#111;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;text-align:center}
  .card{background:#fff;border:2px solid #111;box-shadow:4px 4px 0 #111;padding:28px 20px;max-width:360px;display:grid;gap:12px;justify-items:center}
  h1{margin:0;font:700 1.6rem/1 "Arial Narrow",Impact,sans-serif;text-transform:uppercase}
  p{margin:0;color:#5e5e5e}
  button{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.8rem;background:#f6b90a;border:2px solid #111;box-shadow:4px 4px 0 #111;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="/icons/icon-192.png" width="72" height="72" alt="">
    <h1>You're offline</h1>
    <p>Qsina needs a connection to load the first time. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
