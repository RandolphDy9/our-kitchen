      if(m.playoff){toast("Undo playoff results from the Playoffs tab.");break}
      if(m.sched){toast("Undo tournament results from Courts › Schedule.");break}
      if(live().some(x=>x.court===m.court)){toast(`Court ${m.court} is in use. Finish that game first.`);break}
      try{await evCol("matches").doc(id).update({status:"live",winner:null,scoreA:null,scoreB:null,endedAt:null});toast("Result undone. Game is back on court.")}catch(err){toast("Couldn't undo.")}break}
    case "view-photo":openPhoto(id);break;
    case "close-lb":$("#lightbox").hidden=true;S.viewPhoto=null;break;
    case "bk-new":S.bkBuild=true;S.bkDraft=null;render();break;
    case "bk-cancel":S.bkBuild=false;S.bkDraft=null;render();break;
    case "bk-build":buildDraft();break;
    case "bk-start":await bkStart();break;
    case "bk-pick":S.bkId=id;S.bkSel=null;S.bkDelAsk=false;render();break;
    case "bk-sel":S.bkSel=S.bkSel===id?null:id;S.bkDelAsk=false;refreshLive();break;
    case "bk-close":S.bkSel=null;refreshLive();break;
    case "bk-court":{const br=curBracket();if(br?.virtual)await startSched(pmOf(br,id).sid,$("#bk-court")?.value);else await bkSendCourt(id);break}
    case "bk-win":{const br=curBracket(),a=$("#bkA")?.value,b=$("#bkB")?.value;
      if(br?.virtual){if(await recordSched(pmOf(br,id).sid,t.dataset.w,a===""||a==null?null:+a,b===""||b==null?null:+b)){document.activeElement?.blur();toast("Result saved. The winner moves on.")}break}
      if(br&&await recordPlayoff(br.id,id,t.dataset.w,a===""||a==null?null:+a,b===""||b==null?null:+b)){document.activeElement?.blur();toast("Result saved. The winner moves on.")}break}
    case "bk-undo":{const br=curBracket();if(br?.virtual)await undoSched(pmOf(br,id).sid);else await bkUndo(id);break}
    case "s-start":await startSched(id);break;
    case "s-score":S.sScoring=id;refreshLive();$("#ssA")?.focus();break;
    case "s-cancel":S.sScoring=null;refreshLive();break;
    case "s-win":{const a=$("#ssA")?.value,b=$("#ssB")?.value;if(await recordSched(id,t.dataset.w,a===""||a==null?null:+a,b===""||b==null?null:+b)){document.activeElement?.blur();S.sScoring=null;render();toast("Result saved")}break}
    case "s-undo":await undoSched(id);break;
    case "imp-run":await impRun();break;
    case "imp-del-ask":S.impDelAsk=true;refreshImp();break;
    case "imp-del-no":S.impDelAsk=false;refreshImp();break;
    case "imp-del":await impDelete();break;
    case "set-g":try{await rosterCol().doc(id).update({gender:t.dataset.g})}catch(err){toast("Couldn't update that player.")}break;
    case "bk-del-ask":S.bkDelAsk=true;refreshLive();break;
    case "bk-del-no":S.bkDelAsk=false;refreshLive();break;
    case "bk-del":await bkDelete();break;
    case "heart":await toggleHeart(id);break;
    case "dl-photo":await downloadPhoto(id);break;
    case "lb-ask-del":S.lbConfirm=true;refreshViewer();break;
    case "lb-keep":S.lbConfirm=false;refreshViewer();break;
    case "del-cmt":try{await commentsCol().doc(id).delete()}catch(err){toast("Couldn't delete that comment.")}break;
    case "del-photo":{const p=S.photos.find(x=>x.id===id);try{await galleryCol().doc(id).delete();if(p&&S.assets)S.assets.delete(p.assetId).catch(()=>{});$("#lightbox").hidden=true;toast("Photo deleted")}catch(err){toast("Couldn't delete that photo.")}break}
    case "ci-pick":S.ci.confirm=id;refreshLive();break;
    case "ci-cancel":S.ci.confirm=null;refreshLive();break;
    case "ci-confirm":await claim(id);break;
    case "cele-close":$("#celebrate").hidden=true;break;
    case "cele-go":$("#celebrate").hidden=true;S.tab=t.dataset.tab;render();window.scrollTo(0,0);break;
    case "react":await toggleReaction(id,t.dataset.r);break;
    case "rx-add":{const d=readRxDraft();if(d.length<MAX_REACTIONS)d.push({id:"r"+uid(5),emoji:"⭐",label:"New reaction"});S.rxDraft=d;render();break}
    case "rx-del":{const d=readRxDraft();d.splice(+t.dataset.i,1);S.rxDraft=d;render();break}
    case "ci-continue":S.ci.justDone=false;S.tab="courts";render();window.scrollTo(0,0);break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="pq"){S.pf.q=e.target.value;refreshLive()}
  if(e.target.id==="teamq"){teamSearch(e.target.value);return}
  if(e.target.id==="rq"){S.rq=e.target.value;refreshLive()}
  if(e.target.id==="ciq"){S.ci.q=e.target.value;S.ci.confirm=null;refreshLive()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="evSel")selectEvent(e.target.value);
  if(e.target.id==="ph-who")updateSlots();
  if(e.target.matches("[data-bkcfg]"))readBkCfg();
  if(e.target.dataset.bkslot&&S.bkDraft){const [i,j]=e.target.dataset.bkslot.split("-").map(Number);S.bkDraft.teams[i][j]=e.target.value}
  if(e.target.id==="al-sound"){ls.set("al.sound",e.target.checked);if(e.target.checked){primeAudio();chime()}refreshLive()}
  if(e.target.id==="al-wake"){ls.set("al.wake",e.target.checked);applyWake();toast(e.target.checked?"Your screen will stay on while OurKitchen is open":"Screen can sleep again")}
  if(e.target.id==="impFile"){impFile(e.target.files[0]);e.target.value=""}
  if(e.target.id==="impUpd"&&S.imp?.opts)S.imp.opts.updateEvent=e.target.checked;
  if(e.target.id==="impRep"&&S.imp?.opts)S.imp.opts.replace=e.target.checked;
  if(e.target.id==="sdiv"){S.sdiv=e.target.value;render()}
  if(e.target.id==="ph-file"){uploadPhotos(e.target.files);e.target.value=""}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="ceForm"){await createEvent();return}
  if(f.id==="evForm"){
    const data={name:$("#ef-name").value.trim()||"Untitled event",venue:$("#ef-venue").value.trim(),date:$("#ef-date").value,start:$("#ef-start").value,end:$("#ef-end").value,courts:Math.max(1,Math.min(40,parseInt($("#ef-courts").value)||1))};
    document.activeElement?.blur();
    try{await S.db.doc("events/"+S.eventId).update(data);toast("Event saved")}catch(err){toast("Only admins can edit the event.")}
  }
  if(f.id==="addForm"){const name=$("#ap-name").value.trim();if(!name)return;
    try{await rosterCol().doc(uid()).set({name,gender:$("#ap-g").value,level:$("#ap-l").value,checkedIn:false,createdAt:new Date().toISOString()});$("#ap-name").value="";toast(name+" added")}catch(err){toast("Couldn't add that player.")}}
  if(f.id==="cmtForm"){
    const inp=$("#cmt"), text=inp.value.trim(), a=actorId(); if(!text||!a||!S.viewPhoto) return;
    inp.value="";
    try{await commentsCol().doc(uid()).set({photo:S.viewPhoto,from:a,uid:S.uid||null,text:text.slice(0,280),at:new Date().toISOString()});
      const C=$("#lbComments"); if(C) C.scrollTop=C.scrollHeight;}
    catch(err){inp.value=text;toast("Couldn't post your comment.")}
    return;
  }
  if(f.id==="scoreForm"){
    const a=$("#sA").value,b=$("#sB").value;
    if(a!==""&&b!==""&&a!==b) await saveResult(f.dataset.id,+a>+b?"A":"B");
    else toast("Enter two different scores, or tap who won.");
  }
  if(f.id==="rxForm"){
    const d=readRxDraft().filter(r=>r.emoji&&r.label).slice(0,MAX_REACTIONS);
    if(!d.length){toast("Keep at least one reaction.");return}
    document.activeElement?.blur();
    try{await S.db.doc("events/"+S.eventId).update({reactions:d});S.rxDraft=null;render();toast("Reactions saved")}catch(err){toast("Only admins can change reactions.")}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#lightbox").hidden=true;$("#celebrate").hidden=true}});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox"){e.target.hidden=true;S.viewPhoto=null}});

async function saveResult(id,w){
  const a=$("#sA")?.value,b=$("#sB")?.value;
  const sa=a===""||a==null?null:+a, sb=b===""||b==null?null:+b;
  if(sa!=null&&sb!=null&&((w==="A"&&sa<sb)||(w==="B"&&sb<sa))){toast("That score says the other team won. Check the numbers.");return}
  const pm=S.matches.find(x=>x.id===id);
  if(pm?.sched){ if(await recordSched(pm.sched.s,w==="A"?"a":"b",sa,sb)){document.activeElement?.blur();S.scoring=null;render();toast("Result saved. Court is open.")} return }
  if(pm?.playoff){ if(await recordPlayoff(pm.playoff.b,pm.playoff.m,w==="A"?"a":"b",sa,sb)){document.activeElement?.blur();S.scoring=null;render();toast("Result saved. The winner moves on in the bracket.")} return }
  try{await evCol("matches").doc(id).update({status:"done",winner:w,scoreA:sa,scoreB:sb,endedAt:new Date().toISOString()});
    document.activeElement?.blur();S.scoring=null;render();toast("Result saved. Court is open.")}
  catch(err){toast("Couldn't save. Only admins can record scores.")}
}
async function bulkAdd(text){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean),bad=[];let n=0;
  for(const l of lines){const [name,g,lv]=l.split(/[,\t]/).map(s=>(s||"").trim());
    const gender=/^(f|w)/i.test(g)?"F":/^m/i.test(g)?"M":null,level=/^h/i.test(lv)?"high":/^l/i.test(lv)?"low":null;
    if(!name||!gender||!level){bad.push(l);continue}
    try{await rosterCol().doc(uid()).set({name,gender,level,checkedIn:false,createdAt:new Date().toISOString()});n++}catch(e){bad.push(l)}}
  const ta=$("#bulk");if(ta)ta.value=bad.join("\n");
  toast(`Added ${n} player${n===1?"":"s"}`+(bad.length?`. ${bad.length} line${bad.length===1?"":"s"} need fixing.`:""));
}
async function loadDemo(){
  const men=["Marco Reyes","Paolo Dizon","Jun Tan","Carlo Mendoza","Rico Santos","Ben Aquino","Nico Villanueva","Leo Garcia","Miguel Flores","Tony Cruz","Dan Bautista","Ramon Lim","Jojo Pascual","Andre Kho","Vince Ocampo","Gab Herrera"];
  const wom=["Joy Santos","Ana Lopez","Bea Manalo","Cris Ramos","Liza Torres","Mae Dela Cruz","Pia Gomez","Rose Valdez","Tess Castro","Gwen Fernandez","Ivy Navarro","Kat Perez"];
  const rows=[...men.map((n,i)=>({name:n,gender:"M",level:i%2?"high":"low"})),...wom.map((n,i)=>({name:n,gender:"F",level:i%2?"high":"low"}))];
  toast("Adding demo players…");
  for(const [i,r] of rows.entries()){const inn=i%5!==0;
    try{await rosterCol().doc(uid()).set({...r,demo:true,checkedIn:inn,checkedInAt:inn?new Date(Date.now()-(rows.length-i)*60000).toISOString():null,createdAt:new Date().toISOString()})}catch(e){toast("Couldn't add demo players.");return}}
  toast("28 demo players added");
}
async function saveQR(){
  const e=ev(),src=$("#qr canvas")||$("#qr img");if(!src||!S.downloads)return;
  const W=1200,H=1600,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#f5f5ef";x.fillRect(0,0,W,H);
  const rr=(X,Y,w,h,r,col)=>{x.fillStyle=col;x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h);x.fill()};
  rr(60,60,W-120,420,48,"#f6b90a");
  x.fillStyle="#18181d";x.textBaseline="top";
  let s=84;const T=e.name.toUpperCase();x.font=`700 ${s}px Oswald, sans-serif`;while(x.measureText(T).width>W-260&&s>40){s-=4;x.font=`700 ${s}px Oswald, sans-serif`}
  x.fillText(T,120,130);
  x.font="500 40px Oswald, sans-serif";x.fillStyle="#4a4a55";
  x.fillText([e.venue,fmtDate(e.date)].filter(Boolean).join("  ·  "),120,130+s+30);
  rr(120,330,W-240,110,28,"#111111");x.fillStyle="#f6b90a";x.font="700 44px Oswald, sans-serif";x.textBaseline="middle";
  x.fillText(`${fmtTime(e.start)} – ${fmtTime(e.end)}`,160,385);x.textAlign="right";x.font="600 36px Oswald, sans-serif";x.fillText(`${e.courts} courts`,W-160,385);x.textAlign="center";
  rr(160,540,W-320,880,48,"#ffffff");
  x.fillStyle="#18181d";x.font="700 76px Oswald, sans-serif";x.fillText("SCAN TO CHECK IN",W/2,630);
  x.imageSmoothingEnabled=false;x.drawImage(src,300,700,600,600);
  x.fillStyle="#848995";x.font="600 30px Oswald, sans-serif";x.fillText("EVENT "+e.id.toUpperCase(),W/2,1360);
  x.font="500 34px Oswald, sans-serif";x.fillText("Open your phone camera and point it at the code",W/2,1500);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  try{await S.downloads.save({filename:"checkin-qr-"+e.id+".png",data:blob})}catch(err){if(err?.code!=="declined")toast("Couldn't save the poster.")}
}

boot();
