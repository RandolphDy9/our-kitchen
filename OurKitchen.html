<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OurKitchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: "split-bill" social look. Off-white canvas, cards outlined in thin black with big radii, lime as the hero surface, black cards for emphasis, orange for category tags. Wide display face for headings and numbers. Light-only by choice. */
:root{
  --bg:#f5f5ef; --card:#ffffff; --card-2:#ededE6; --ink:#121212; --muted:#7b7b73; --line:#121212; --soft:#dedfd6;
  --lime:#f6b90a; --lime-2:#c4e83c; --lime-ink:#121212;
  --orange:#ffad5c; --black:#121212; --on-black:#ffffff;
  --ok:#1d8f50; --danger:#d9453b;
  --f-display:"Syne","Arial Black",system-ui,sans-serif;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:30px; --r-lg:24px; --r:18px; --r-sm:14px;
  --b:1.5px solid var(--line);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.08;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.big-num{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1040px}

/* Header with logo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.logo{display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:var(--ink)}
.logo svg{width:36px;height:36px}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.top-title{min-width:0;flex:1}
.top-title b{display:none}
.top-title span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.iconpill{display:inline-flex;align-items:center;gap:6px;border:var(--b);border-radius:999px;background:var(--card);padding:6px 12px;font-weight:600;font-size:.8rem;cursor:pointer;min-height:38px}
.plus-btn{width:40px;height:40px;border-radius:50%;background:var(--lime);border:var(--b);display:grid;place-items:center;cursor:pointer;flex:none}
.mark,.sq{width:44px;height:44px;border-radius:50%;background:var(--lime);border:var(--b);display:grid;place-items:center;flex:none}
.sq.dark{background:var(--black);color:var(--lime);border-color:var(--black)}
main{padding-block:6px calc(120px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head .link,.seeall{font-size:.74rem;font-weight:600;background:var(--card-2);color:var(--muted);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.greet h1{font-size:clamp(1.6rem,6vw,2rem)}
.greet p{color:var(--muted);font-size:.9rem;margin-top:4px}

/* Cards */
.card{background:var(--card);border:var(--b);border-radius:var(--r-lg);padding:18px;display:grid;gap:14px;min-width:0}
.card.lav,.card.butter{background:var(--card)}
.card.mint{background:var(--lime)}
.card.black{background:var(--black);color:var(--on-black);border-color:var(--black)}

/* Stats */
.statgrid,.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:var(--b);border-radius:var(--r);padding:14px;display:grid;gap:2px;align-content:start;min-width:0}
.stat .ico{width:36px;height:36px;border-radius:12px;border:var(--b);background:var(--lime);display:grid;place-items:center;margin-bottom:8px}
.stat .ico svg.i{width:17px;height:17px}
.stat .label{font-size:.76rem;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:1.65rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--f);font-size:.85rem;font-weight:600;color:var(--muted);margin-left:2px}
.stat:first-child{background:var(--black);color:var(--on-black);border-color:var(--black)}
.stat:first-child .label,.stat:first-child b small{color:#b9b9b0}
@media (max-width:420px){.stat{padding:11px}.stat b{font-size:1.35rem}}

/* Lime hero with court gauge */
.hero{position:relative;overflow:hidden;background:var(--lime);border:var(--b);border-radius:var(--r-xl);padding:20px 20px 0;display:grid;gap:10px}
.hero-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.hero .eyebrow{font-size:.78rem;font-weight:600}
.hero .clock{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .clock small{font-family:var(--f);font-size:.8rem;font-weight:600;opacity:.7;margin-left:4px}
.hero h1{font-size:clamp(1.5rem,5.5vw,1.9rem);max-width:16ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.84rem;font-weight:500}
.hero .meta span{display:inline-flex;align-items:center;gap:5px}
.hero .meta svg.i{width:15px;height:15px}
.gauge-wrap{position:relative;display:grid;justify-items:center;margin-top:4px}
.gauge-label{text-align:center;display:grid;gap:0;margin-bottom:6px}
.gauge-label span{font-size:.78rem;font-weight:600}
.gauge-label b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.02em}
.gauge{width:100%;max-width:340px;height:auto;display:block}
.gauge text{font-family:var(--f);font-size:10px;font-weight:700;fill:#ffffff}
.go{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}
.go i{width:46px;height:46px;border-radius:50%;background:var(--card);border:var(--b)}
.go b{width:46px;height:46px;border-radius:50%;background:var(--black);color:var(--lime);display:grid;place-items:center;margin-left:-22px;font-size:1.2rem}
.ball,.hero-emoji,.boost-emoji{display:none}
.toppill{display:inline-flex;align-items:center;gap:6px;border:var(--b);border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:700;background:var(--card)}
.toppill .dot.live{background:var(--ok)}
.timer{display:none}

/* Player boost + profile */
.me-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:720px){.me-grid{grid-template-columns:minmax(0,1fr)}}
.boost{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;display:grid;gap:10px;align-content:start;background:var(--lime);color:var(--ink);border:var(--b)}
.boost.up{background:var(--lime);color:var(--ink);border:var(--b)}
.boost h1{font-size:clamp(1.8rem,7vw,2.4rem);max-width:11ch;position:relative}
.boost p{position:relative;max-width:60%;font-size:.92rem;font-weight:500}
.boost-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.boost .eyebrow{font-size:.78rem;font-weight:600;opacity:.75}
.boost .toppill{background:var(--card);border-color:var(--ink);color:var(--ink)}
.boost.up .toppill{background:var(--card);border-color:var(--ink)}
.boost-art{position:absolute;right:-10px;bottom:-14px;width:150px;height:auto;pointer-events:none}
.boost.up .boost-art{right:10px;bottom:16px;width:120px}
.dots{display:flex;align-items:center;gap:7px;position:relative;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(18,18,18,.22);display:grid;place-items:center}
.boost.up .dots i{background:rgba(18,18,18,.22)}
.dots i.l{background:var(--ink)}
.boost.up .dots i.l{background:var(--ink)}
.dots i.w{width:24px;height:24px;background:var(--ink);color:var(--lime)}
.boost.up .dots i.w{background:var(--ink);color:var(--lime)}
.dots i.w svg.i{width:13px;height:13px;stroke-width:3}
.dots i.cur{width:14px;height:14px;background:transparent;border:2.5px solid currentColor}
.dots-label{font-size:.74rem;font-weight:700;position:relative;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.profile{background:var(--card);border:var(--b);border-radius:var(--r-xl);padding:18px;display:grid;justify-items:center;text-align:center;gap:6px;min-width:0}
.profile .av{width:78px;height:78px;font-size:1.5rem;border:var(--b);border-radius:50%;margin-bottom:4px;box-shadow:0 0 0 5px var(--lime)}
.profile h2{font-size:1.25rem}
.profile .where{display:flex;align-items:center;gap:5px;font-size:.86rem;font-weight:500}
.profile .where svg.i{width:15px;height:15px}
.pboxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:8px}
.pbox{border:var(--b);border-radius:var(--r-sm);padding:9px 6px;display:grid;justify-items:center;gap:1px}
.pbox .top{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;position:static;background:none}
.pbox .top svg.i{width:15px;height:15px}
.pbox span{font-size:.72rem;color:var(--muted);font-weight:600}
.pbox:nth-child(2){background:var(--lime)}
.pbox:nth-child(2) span{color:var(--ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--b);background:var(--card);padding:9px 18px;border-radius:999px;font-weight:700;cursor:pointer;min-height:44px;font-size:.9rem}
.btn:hover{background:var(--card-2)}
.btn.dark{background:var(--black);color:var(--on-black);border-color:var(--black)}
.btn.dark:hover{background:#2c2c2c}
.btn.dark:not(.sm){padding-right:6px;justify-content:space-between;gap:14px}
.btn.dark:not(.sm)::after{content:"→";width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:1rem;flex:none}
.btn.dark:not(.sm) > svg.i:first-child{display:none}
.btn.lime{background:var(--lime)}
.btn.soft{background:var(--card)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 14px;min-height:36px;font-size:.82rem}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--card);border:var(--b);border-radius:var(--r-sm);padding:10px 14px;min-height:46px;width:100%;min-width:0;font-weight:500}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--lime)}
textarea{min-height:110px;resize:vertical;font-size:.88rem}
.field{display:grid;gap:6px;min-width:0}
.field > label,.lbl{font-size:.78rem;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > .field{flex:1 1 130px}
/* Checkbox as a toggle switch */
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:.88rem;min-height:42px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border:var(--b);border-radius:999px;background:var(--card);position:relative;cursor:pointer;flex:none;margin:0}
.check input::before{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:transform .15s}
.check input:checked{background:var(--black)}
.check input:checked::before{transform:translateX(18px);background:var(--lime)}
details summary{cursor:pointer;font-weight:700;font-size:.88rem}

/* Pills & tags */
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--lime);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg.i{width:13px;height:13px;stroke-width:2.5}
.pill.grey{background:var(--card-2);color:var(--muted)}
.pill.dark{background:var(--black);color:var(--lime)}
.pill.orange{background:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:999px;border:var(--b);background:var(--card);white-space:nowrap}
.chip svg.i{width:12px;height:12px}
.chip.high{background:var(--black);color:var(--lime);border-color:var(--black)}
.chip.low{background:var(--card)}
.chip.open{background:var(--lime)}
.chip.on{background:var(--card-2);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.tag i{display:none}
.tag.mens{background:var(--black);color:var(--lime)}
.tag.womens{background:var(--lime);color:var(--ink)}
.tag.mixed{background:var(--lime);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#c6c6bd;flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(29,143,80,.18)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.status.live{color:var(--ok)}

/* Avatars */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:800;color:var(--ink);flex:none;background:var(--card-2);border:var(--b)}
.av.c0{background:#f6b90a}.av.c1{background:#ffd3a8}.av.c2{background:#cfe3ff}.av.c3{background:#f1d6ff}.av.c4{background:#ffffff}
.stack{display:flex}.stack .av{width:30px;height:30px;font-size:.66rem}.stack .av + .av{margin-left:-9px}
.quad{display:grid;grid-template-columns:repeat(2,30px);gap:3px;padding:4px;border:var(--b);border-radius:12px;background:var(--card)}
.quad .av{width:30px;height:30px;border-radius:8px;font-size:.64rem;border-width:1px}

/* Segmented */
.seg{display:flex;background:var(--card);border:var(--b);border-radius:999px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--black);color:var(--lime)}

/* Lists */
.list{display:grid;gap:10px}
.item{background:var(--card);border:var(--b);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .sub{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.empty{background:var(--card);border:var(--b);border-radius:var(--r-lg);padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h2,.empty h3{color:var(--ink)}
.notice{background:var(--lime);border:var(--b);border-radius:var(--r);padding:12px 14px;font-size:.88rem}

/* Activity feed */
.feed{display:grid}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.act + .act{border-top:1px solid var(--soft)}
.act .t{font-weight:700;overflow-wrap:anywhere}
.act .s{font-size:.8rem;color:var(--muted)}
.act .amt{font-family:var(--f-display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.act .em{font-size:1.4rem;line-height:1}

/* Horizontal result cards */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,46%);gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard{scroll-snap-align:start;border:var(--b);border-radius:var(--r-lg);padding:14px;display:grid;gap:8px;background:var(--card);min-width:0}
.rcard:first-child{background:var(--black);color:var(--on-black);border-color:var(--black)}
.rcard .lab{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;opacity:.7}
.rcard .lab .pill{opacity:1}
.rcard:first-child .lab{opacity:1;color:#b9b9b0}
.rcard .what{font-size:.82rem;font-weight:600;margin-top:6px}
.rcard .names{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15;overflow-wrap:anywhere}
.rcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.74rem;font-weight:600;margin-top:4px}
.rcard:first-child .stack .av{border-color:var(--black)}

/* Leaderboards */
.lboard{display:grid}
.lrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0}
.lrow + .lrow{border-top:1px solid var(--soft)}
.lrow .name{font-weight:700;overflow-wrap:anywhere}
.lrow .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.lrow .rnk{font-family:var(--f-display);font-weight:800;font-size:1.15rem;width:22px;text-align:center}
.avq{display:contents}
.rk{display:none}

/* Courts ("Groups" cards) */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.court{border:var(--b);border-radius:var(--r-lg);padding:14px;display:grid;gap:12px;min-width:0;background:var(--card);align-content:start}
.court.me{background:var(--lime)}
.court-head{display:flex;align-items:center;gap:8px}
.court-head b{font-family:var(--f-display);font-weight:700;font-size:1.15rem;flex:1}
.court-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.ibox{width:40px;height:40px;border:var(--b);border-radius:12px;display:grid;place-items:center;background:var(--card)}
.court.me .ibox{background:var(--lime)}
.ibox svg.i{width:20px;height:20px}
.court-body .lab{font-size:.74rem;font-weight:600;color:var(--muted)}
.court.me .court-body .lab{color:var(--ink);opacity:.7}
.court-body .tA{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}
.court-body .tB{font-size:.84rem;font-weight:600;overflow-wrap:anywhere}
.court-body .tB em{font-style:normal;color:var(--muted);font-weight:700;font-size:.72rem;margin-right:4px}
.track{position:relative;height:22px;border-radius:999px;background:var(--black);display:flex;align-items:center;padding:0 4px}
.track .fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:var(--lime);min-width:16px}
.track .ticks{position:relative;display:flex;justify-content:space-between;width:100%;padding:0 6px}
.track .ticks i{width:4px;height:4px;border-radius:50%;background:#6f6f68}
.court-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;font-weight:600}
.court-foot .status{color:var(--ink)}
.court.free{border-style:dashed;background:transparent;min-height:110px}
.court.free .court-head b{color:var(--muted)}
.teams,.court-meta{display:none}
.score-form{display:grid;gap:8px;background:var(--card);border:var(--b);border-radius:var(--r);padding:12px}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:.86rem;font-weight:700}
.score-row input{text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem;padding:6px}
.queue{display:flex;flex-wrap:wrap;gap:6px}

/* Results list */
.result{background:var(--card);border:var(--b);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.result-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
.result-line{display:flex;align-items:center;gap:10px;padding:4px 0}
.result-line .names{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.result-line.lose .names{color:var(--muted);font-weight:500}
.trophy,.rank{display:none}

/* Chart */
.chart-legend{display:flex;gap:6px;flex-wrap:wrap}
.chart-legend .pill i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--soft);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f)}
.chart .axis.day{fill:var(--ink);font-weight:700;font-size:10.5px}
.chart .l1{stroke:var(--ink);stroke-width:2.4;fill:none}
.chart .l2{stroke:var(--lime);stroke-width:2.4;fill:none}
.chart .pt{fill:var(--lime);stroke:var(--ink);stroke-width:2}
.chart .vline{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;background:var(--black);color:var(--on-black);border-radius:10px;padding:7px 10px;font-size:.74rem;line-height:1.35;white-space:nowrap;transform:translate(-100%,-100%);margin-left:-8px;margin-top:-6px;pointer-events:none}
.tip span{opacity:.6;display:block}
.tip.below{transform:translate(-100%,0);margin-top:10px}

/* QR */
.qr-box{background:var(--lime);border:var(--b);border-radius:var(--r-lg);padding:16px;display:grid;justify-items:center;gap:8px}
.qr-box b{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.qr-box #qr{width:200px;height:200px;max-width:100%;background:#ffffff;border:var(--b);border-radius:14px;overflow:hidden;padding:0}
.qr-box #qr img,.qr-box #qr canvas{max-width:100%;height:auto}
.qr-box .code{font-size:.72rem;letter-spacing:.14em;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)!important}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--soft)}
th{font-size:.74rem;color:var(--muted);font-weight:700}
td:first-child{font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--black);overflow:hidden;margin-top:4px;min-width:50px;padding:1.5px}
.bar i{display:block;height:100%;background:var(--lime);border-radius:999px}

/* Photos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border:var(--b);border-radius:var(--r);overflow:hidden;background:var(--card);aspect-ratio:1/1;max-width:100%;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:8px;bottom:8px;background:var(--lime);color:var(--ink);border:var(--b);font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots{display:flex;gap:6px;align-items:center}
.slot{width:28px;height:28px;border-radius:50%;border:var(--b);background:var(--card)}
.slot.used{background:var(--lime)}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(18,18,18,.9);display:grid;place-items:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.viewer{background:var(--card);border:var(--b);border-radius:var(--r-xl);overflow:hidden;width:min(960px,100%);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);max-height:calc(100dvh - 32px)}
@media (max-width:760px){.viewer{grid-template-columns:minmax(0,1fr);max-height:none}}
.viewer-img{background:#121212;display:grid;place-items:center;min-height:240px}
.viewer-img img{max-width:100%;max-height:min(70vh,640px);display:block;object-fit:contain}
.viewer-side{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;padding:16px;min-width:0;min-height:0}
.vhead{display:flex;align-items:center;gap:10px}
.vhead .who{flex:1;min-width:0}
.vhead .who b{display:block;font-weight:800;overflow-wrap:anywhere}
.vhead .who span{font-size:.78rem;color:var(--muted)}
.close-x{width:38px;height:38px;border-radius:50%;border:var(--b);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:1.1rem;font-weight:700;flex:none}
.vacts{display:flex;gap:8px;flex-wrap:wrap}
.heart-btn[aria-pressed="true"]{background:var(--lime)}
.heart-btn[aria-pressed="true"] svg.i{fill:var(--ink)}
.comments{overflow-y:auto;min-height:60px;display:grid;align-content:start;gap:0;border-top:1px solid var(--soft);padding-top:4px}
.cmt-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0}
.cmt-row + .cmt-row{border-top:1px solid var(--soft)}
.cmt-row .av{width:32px;height:32px;font-size:.66rem}
.cmt-row b{font-size:.84rem;font-weight:800}
.cmt-row b span{font-weight:500;color:var(--muted);font-size:.74rem;margin-left:6px}
.cmt-row p{font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
.cmt-row .x{border:0;background:none;color:var(--muted);font-size:.74rem;font-weight:700;cursor:pointer;padding:2px 4px}
.cmt{display:flex;gap:8px;align-items:center}
.cmt input{flex:1}
.ph .ph-meta{position:absolute;right:8px;top:8px;left:auto;bottom:auto;display:flex;gap:4px;background:none;border:0;padding:0;max-width:none;border-radius:0;overflow:visible}
.ph-meta b{display:inline-flex;align-items:center;gap:3px;background:var(--card);border:var(--b);border-radius:999px;padding:1px 7px;font-size:.68rem;font-weight:800;color:var(--ink)}
.ph-meta svg.i{width:11px;height:11px;stroke-width:2.6}
.lightbox figure{margin:0;display:grid;gap:12px;justify-items:center;max-width:100%}
.lightbox img{max-height:76vh;max-width:100%;border-radius:var(--r)}
.lightbox figcaption{color:#ffffff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.9rem}
.lightbox .btn{background:#ffffff;color:#121212}

/* Check-in splash */
.splash{position:relative;overflow:hidden;background:var(--lime);border:var(--b);border-radius:var(--r-xl);min-height:330px}
.splash svg.art{position:absolute;inset:0;width:100%;height:100%}
.splash .copy{position:relative;padding:62px 20px 20px 118px;display:grid;gap:10px}
.splash h1{font-size:clamp(2rem,8vw,2.6rem);line-height:1.02}
.splash p{font-size:.9rem;font-weight:500;max-width:30ch}
.splash .meta{display:grid;gap:2px;font-size:.82rem;font-weight:700}
.pick{display:grid;gap:8px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px;border-radius:var(--r);border:var(--b);background:var(--card);cursor:pointer;font-weight:700}
.pick button:hover{background:var(--lime)}
.pick button .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done{display:grid;justify-items:center;text-align:center;gap:10px;padding:28px 18px}
.done-badge{width:88px;height:88px;border-radius:50%;background:var(--lime);border:var(--b);display:grid;place-items:center}
.done-badge svg.i{width:40px;height:40px;stroke-width:2.6}

/* Reactions */
.kudos{display:inline-flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.kudos span{white-space:nowrap}
.reacts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.react{display:inline-flex;align-items:center;gap:6px;border:var(--b);background:var(--card);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.8rem;cursor:pointer;min-height:38px}
.react .e{font-size:1.05rem;line-height:1}
.react .n{font-variant-numeric:tabular-nums;min-width:1ch;color:var(--muted)}
.react[aria-pressed="true"]{background:var(--lime)}
.react[aria-pressed="true"] .n{color:var(--ink)}
.react:disabled{cursor:default;opacity:.5}
.rx-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center}
.rx-row input:first-child{text-align:center;font-size:1.3rem;padding:6px}
.mystats{display:none}

/* Celebration */
.celebrate{position:fixed;inset:0;z-index:35;background:var(--lime);display:grid;place-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}
.celebrate .inner{display:grid;gap:14px;justify-items:center;max-width:420px;position:relative}
.celebrate .big{width:128px;height:128px;border-radius:50%;background:var(--card);border:var(--b);display:grid;place-items:center;font-size:3.6rem;line-height:1}
.celebrate .big svg.i{width:58px;height:58px}
.celebrate h1{font-size:clamp(2rem,8vw,2.8rem)}
.celebrate p{font-size:1.05rem;font-weight:500}
.celebrate .emojis{font-size:1.6rem;letter-spacing:.1em}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .celebrate .big{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .done-badge{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .gauge .needle{transition:transform .8s cubic-bezier(.2,1.2,.4,1)}
  .go b{transition:transform .2s}.go:hover b{transform:translateX(4px)}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  .confetti i{animation:fall 2.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

/* Bottom nav */
.stripe{display:none}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;display:flex;gap:4px;background:var(--black);padding:5px;border-radius:999px;box-shadow:0 12px 30px rgba(18,18,18,.25);max-width:calc(100% - 32px)}
.nav button{border:0;background:none;color:#a5a59c;border-radius:999px;height:48px;min-width:48px;padding:0 14px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:.82rem}
.nav button svg.i{width:21px;height:21px}
.nav button span{display:none}
.nav button[aria-current="page"]{background:var(--lime);color:var(--ink)}
.nav button[aria-current="page"] span{display:inline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--black);color:var(--on-black);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* ===== OurKitchen skin: yellow / white / black, square, bold caps, hard shadows ===== */
:root{
  --bg:#f7f6f2; --card:#ffffff; --card-2:#f1efe8; --ink:#111111; --muted:#5e5e5e; --line:#111111; --soft:#d9d6cc;
  --lime:#f6b90a; --lime-2:#ffd34d; --lime-ink:#111111; --orange:#ffffff; --black:#111111;
  --b:2px solid var(--line);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{border-radius:0!important}
h1,h2,h3{text-transform:uppercase;letter-spacing:.005em;line-height:1.02}
.hero,.boost,.court,.profile,.splash,.viewer{box-shadow:4px 4px 0 var(--ink)}
.court.free{box-shadow:none}
.court.me{box-shadow:6px 6px 0 var(--ink)}
.logo b{font-family:var(--f-display);text-transform:uppercase;font-size:1.35rem;letter-spacing:.02em}
.btn{text-transform:uppercase;letter-spacing:.05em;font-size:.78rem}
.btn.dark{background:var(--lime);color:var(--ink);border:var(--b);box-shadow:4px 4px 0 var(--ink)}
.btn.dark:hover{background:var(--lime-2)}
.btn.dark:not(.sm){padding-right:0;gap:14px}
.btn.dark:not(.sm)::after{background:var(--ink);color:var(--lime);width:46px;height:auto;align-self:stretch;margin:-9px 0;font-size:1.25rem}
.btn.dark:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.dark.sm{box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.field > label,.lbl,.stat .label,.dots-label,.hero .eyebrow,.boost .eyebrow,.gauge-label span,.seeall,.sec-head .link,.rcard .lab,.rcard .what,.court-body .lab,.pbox span,.tile .label{text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:700}
.pill,.chip,.tag,.toppill{text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}
.tag.womens{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag.mixed{background:var(--lime)}
.seg button{text-transform:uppercase;letter-spacing:.05em;font-size:.74rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.nav{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--lime)}
.nav button{text-transform:uppercase;letter-spacing:.05em;font-size:.74rem}
.toast{color:var(--lime);border:2px solid var(--ink)}
.chart .l2{stroke:var(--lime);stroke-width:3}
.hero .clock,.gauge-label b,.stat b,.pbox .top,.rcard .names,.court-head b,.act .amt,.lrow .rnk{font-family:var(--f-display)}
.rcard .names,.court-body .tA{text-transform:uppercase}
.splash h1,.boost h1,.hero h1,.celebrate h1{line-height:.98}
.qr-box{background:var(--lime)}
.profile .av{box-shadow:5px 5px 0 var(--lime)}
.dots i.w{background:var(--ink);color:var(--lime)}
.av.c0{background:var(--lime)}.av.c1,.av.c3{background:#ffffff}.av.c2{background:var(--card-2)}.av.c4{background:var(--ink);color:var(--lime)}
.court-head b{text-transform:uppercase}
.logo b i{font-style:normal;background:var(--lime);border:2px solid var(--ink);padding:0 4px;margin-left:3px;display:inline-block;line-height:1.1}
@media (max-width:380px){.logo b{font-size:1.1rem}}
/* Playoffs */
.bk-card{gap:10px}
.bk-scroll{overflow-x:auto;padding:4px 6px 16px;scrollbar-width:thin}
.bracket{display:grid;gap:30px;align-items:stretch;min-height:440px;padding-top:30px}
.bracket.b8{grid-template-columns:repeat(5,minmax(150px,1fr));min-width:900px}
.bracket.b2{grid-template-columns:minmax(220px,320px);justify-content:center}
.bracket.b4{grid-template-columns:repeat(3,minmax(150px,1fr));min-width:540px}
.bcol{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0}
.bcol > .rt{position:absolute;top:-30px;left:0;right:0;text-align:center;font-family:var(--f-display);text-transform:uppercase;font-size:.8rem;letter-spacing:.06em;font-weight:700}
.pair{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-around}
.pair::after{content:"";position:absolute;top:25%;bottom:25%;width:15px;border:2px solid var(--ink)}
.pair.l::after{right:-17px;border-left:0}.pair.r::after{left:-17px;border-right:0}
.pair::before{content:"";position:absolute;top:50%;width:15px;height:2px;background:var(--ink)}
.pair.l::before{right:-32px}.pair.r::before{left:-32px}
.bcol.mid .bm{position:relative}
.bcol.mid.l .bm::after,.bcol.mid.r .bm::after{content:"";position:absolute;top:50%;width:30px;height:2px;background:var(--ink)}
.bcol.mid.l .bm::after{left:calc(100% + 2px)}.bcol.mid.r .bm::after{right:calc(100% + 2px)}
.bcol.center{justify-content:stretch}
.ctop,.cbot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.ctop{justify-content:flex-end;padding-bottom:8px}.cbot{justify-content:flex-start;padding-top:18px}
.cbot .bm{width:100%}
.cup svg{width:58px;height:auto;display:block}
.ct{font-family:var(--f-display);text-transform:uppercase;font-weight:700;font-size:.85rem;letter-spacing:.06em}
.bm{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:0;font:inherit;color:inherit}
button.bm{cursor:pointer}
button.bm:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.bm.sel{outline:3px solid var(--lime);outline-offset:3px}
.bm.final{border-width:3px;box-shadow:6px 6px 0 var(--lime),6px 6px 0 2px var(--ink)}
.bm-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 8px;background:var(--ink);color:#ffffff;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bm-h .lv{color:var(--lime)}
.rowt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px;font-size:.84rem;font-weight:700;min-height:36px}
.rowt + .rowt{border-top:2px solid var(--ink)}
.rowt .sd{font-family:var(--f-display);font-size:.82rem;color:var(--muted);text-align:center}
.rowt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowt .nm em{font-style:normal;font-size:.62rem;background:var(--ink);color:var(--lime);padding:1px 4px;text-transform:uppercase;letter-spacing:.06em;vertical-align:1px}
.rowt .sc{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex}
.rowt .sc svg.i{width:15px;height:15px;stroke-width:3}
.rowt.win{background:var(--lime)}
.rowt.lose{color:var(--muted);font-weight:500}
.rowt.tbd .nm{color:var(--muted);font-style:italic;font-weight:500;font-size:.76rem}
.rowt.me{box-shadow:inset 5px 0 0 var(--ink)}
.road{background:var(--lime);border:var(--b);box-shadow:4px 4px 0 var(--ink);padding:16px 18px;display:grid;gap:6px;min-width:0}
.road-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.road .eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.road h2{font-size:clamp(1.5rem,6vw,2rem)}
.road p{font-size:.92rem}
.road-steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rs{border:2px solid var(--ink);padding:2px 8px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--card)}
.rs.w{background:var(--ink);color:var(--lime)}
.rs.l{color:var(--muted)}
.rs.p{border-style:dashed}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding-top:6px}
.pod{display:grid;justify-items:center;text-align:center;gap:4px;min-width:0}
.pod .medal{font-size:2.2rem;line-height:1}
.pod b{font-family:var(--f-display);text-transform:uppercase;font-size:.95rem;line-height:1.05;overflow-wrap:anywhere}
.pod.gold b{font-size:1.15rem}
.pod .place{font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pod .step{width:100%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;font-weight:700;box-shadow:4px 4px 0 var(--ink);margin-top:4px}
.pod.gold .step{height:112px;background:var(--lime)}.pod.silver .step{height:80px}.pod.bronze .step{height:56px}
.draft{display:grid;gap:8px}
.draft-row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.draft-row .seed{font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-align:center}
.iconpill{white-space:nowrap}
.nav button{padding:0 10px;min-width:44px}
@media (max-width:460px){.top-title{display:none}}
.rowt.me .sd{color:var(--ink)}
/* Schedule + import */
.tslot{display:grid;gap:8px}
.tslot-h{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);text-transform:uppercase;border-bottom:var(--b);padding-bottom:4px}
.tslot-h b{font-size:1.35rem}

function gauge(L,N){
  const cx=170,cy=158,R=146,r=96,W=340,H=160;
  const pt=(rad,a)=>[cx+rad*Math.cos(Math.PI*(1-a)),cy-rad*Math.sin(Math.PI*(1-a))];
  const f=n=>n.toFixed(1);
  const arc=(a0,a1,ro,ri)=>{const [x0,y0]=pt(ro,a0),[x1,y1]=pt(ro,a1),[x2,y2]=pt(ri,a1),[x3,y3]=pt(ri,a0);const lg=a1-a0>.5?1:0;
    return `M${f(x0)},${f(y0)} A${ro},${ro} 0 ${lg} 1 ${f(x1)},${f(y1)} L${f(x2)},${f(y2)} A${ri},${ri} 0 ${lg} 0 ${f(x3)},${f(y3)}Z`};
  const n=Math.max(1,N), liveSet=new Set(live().map(m=>m.court));
  let segs="",labels="",ticks="";
  for(let i=1;i<=n;i++){
    const a0=(i-1)/n,a1=i/n,am=(a0+a1)/2;
    if(liveSet.has(i)) segs+=`<path d="${arc(a0+.004,a1-.004,r+14,r+2)}" fill="#f6b90a"/>`;
    if(n<=16||i%2){const [lx,ly]=pt((R+r)/2+7,am);labels+=`<text x="${f(lx)}" y="${f(ly)}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${f(am*180-90)} ${f(lx)} ${f(ly)})">${i}</text>`}
    if(i<n){const [t0x,t0y]=pt(R-3,a1),[t1x,t1y]=pt(R-12,a1);ticks+=`<line x1="${f(t0x)}" y1="${f(t0y)}" x2="${f(t1x)}" y2="${f(t1y)}" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>`}
  }
  return `<svg class="gauge" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L} of ${N} courts in play"><path d="${arc(0,.5,R,r)}" fill="#121212"/><path d="${arc(.5,1,R,r)}" fill="#121212"/>${segs}${ticks}${labels}</svg>`;
}

function uid(n=8){const a="abcdefghijkmnpqrstuvwxyz23456789";const r=new Uint8Array(n);crypto.getRandomValues(r);return [...r].map(x=>a[x%a.length]).join("")}

async function boot(){
  const h=location.hash.slice(1);

  render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,assets,downloads]=await Promise.all([use("db"),use("user"),use("assets"),use("downloads")]);
  Object.assign(S,{db,user,assets,downloads});
  if(user){S.dbAdmin=await user.canEdit().catch(()=>false);S.isOwner=await user.isOwner().catch(()=>false);S.uid=await user.id().catch(()=>null)}
  recomputeRole();
  if(!db){S.offline=true;S.ready=true;render();return}
  if(!S.eventId) S.eventId=ls.get("lastEvent",null);
  db.collection("roles").onSnapshot(sn=>{S.roles=sn.docs.map(d=>({id:d.id,...d.data()}));recomputeRole();if(S.team)refreshTeam();else render()},()=>{});
  db.collection("adminstatus").onSnapshot(sn=>{S.astatus=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));recomputeRole();if(S.team)refreshTeam()},()=>{});
  db.collection("events").onSnapshot(snap=>{
    S.events=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    S.ready=true;
    let next=S.events.some(e=>e.id===S.eventId)?S.eventId:null;
    if(!next&&S.unlocked&&!S.fromQR) next=S.events[0]?.id||null;
    if(next!==S.eventId||!unsubs.length) selectEvent(next); else render();
  },()=>{S.ready=true;S.offline=true;render()});
}

function tabsFor(){
  if(S.team||S.creating) return [];
  if(isAdminView()) return [["event","Event","home"],["players","Players","users"],["courts","Courts","grid"],["bracket","Playoffs","bracket"],["results","Results","trophy"],["photos","Photos","image"]];
  if(me()) return [["courts","Courts","grid"],["bracket","Playoffs","bracket"],["people","Players","users"],["results","Results","trophy"],["photos","Photos","image"]];
  return [];

function render(){
  if(document.activeElement && document.activeElement.matches("input[type=text],input[type=search],input[type=number],textarea") && document.activeElement.closest("#main")){
    // keep typing undisturbed; refresh only the live parts
    refreshLive(); renderTop(); checkCelebrate(); refreshViewer(); return;
  }
  renderTop();
  const tabs=tabsFor();
  if(tabs.length && !tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  const nav=$("#nav"); nav.hidden=!tabs.length;
  nav.innerHTML=tabs.map(([k,l,i])=>`<button data-tab="${k}" aria-label="${l}" ${S.tab===k?'aria-current="page"':""}>${ic(i)}<span>${l}</span></button>`).join("");
  const sc=$(".bk-scroll"),sl=sc?sc.scrollLeft:null;
  $("#main").innerHTML=page();checkCelebrate();refreshViewer();keepBkScroll(sl);
  afterRender();
}
function keepBkScroll(sl){const n=$(".bk-scroll");if(!n)return;const key=(curBracket()?.id||"")+"|"+S.tab;if(sl!=null&&S._bkCentered===key)n.scrollLeft=sl;else{n.scrollLeft=(n.scrollWidth-n.clientWidth)/2;S._bkCentered=key}}
function refreshLive(){

  const sc0=$(".bk-scroll"),sl0=sc0?sc0.scrollLeft:null;
  const act=document.activeElement;document.querySelectorAll("[data-live]").forEach(el=>{if(act&&act!==document.body&&el.contains(act)&&act.matches("input,select,textarea"))return;const f=LIVE[el.dataset.live];if(f)el.innerHTML=f()});

}

/* ---------- hero ---------- */
function hero(e,go=true){
  const now=new Date(), st=at(e.date,e.start), en=at(e.date,e.end);
  let big="–", small="", state="";
  if(st&&en){
    if(now<st){big=dur(st-now);small="to first serve";state="Upcoming"}
    else if(now<=en){big=dur(en-now);small="left to play";state='<span class="dot live"></span>Live'}
    else {big=dur(en-st);small="played";state="Wrapped up"}
  }
  const inn=S.players.filter(p=>p.checkedIn).sort((a,b)=>(b.checkedInAt||"").localeCompare(a.checkedInAt||""));
  const N=e.courts||0, L=live().length;
  return `<section class="hero">
    <div class="hero-top"><div><span class="eyebrow">Event clock</span><div class="clock">${big}<small>${small}</small></div></div>
      <div style="display:flex;gap:4px;align-items:center"><span class="stack">${inn.slice(0,3).map(av).join("")}</span>${inn.length>3?`<span class="pill dark">+${inn.length-3}</span>`:""}</div></div>
    <h1>${esc(e.name)}</h1>
    <div class="meta"><span>${ic("pin")}${esc(e.venue||"Venue TBA")}</span><span>${ic("clock")}${esc(fmtTime(e.start))}–${esc(fmtTime(e.end))}</span>${state?`<span class="toppill">${state}</span>`:""}</div>
    <div class="gauge-wrap"><div class="gauge-label"><span>Courts in play</span><b>${L} / ${N}</b></div>${gauge(L,N)}
      ${go?`<button class="go" data-tab="courts" aria-label="Open the court board"><i></i><b>→</b></button>`:""}</div>
  </section>`;
}

/* ---------- Progress chart ---------- */
function pulseCard(){
  return `<section class="card"><div class="sec-head"><h2>Progress</h2>
    <div class="chart-legend"><span class="pill"><i style="background:var(--ink)"></i>Check-ins</span><span class="pill"><i style="background:var(--lime)"></i>Games done</span></div></div>
    <div data-live="pulse">${pulseHTML()}</div></section>`;
}
function pulseHTML(){
  const ins=S.players.filter(p=>p.checkedIn&&p.checkedInAt).map(p=>+new Date(p.checkedInAt));
  const gs=done().filter(m=>m.endedAt).map(m=>+new Date(m.endedAt));
  const all=[...ins,...gs];
  if(all.length<2) return `<p class="small muted">The chart fills in as players arrive and games finish.</p>`;
  let t1=Math.max(...all), t0=Math.min(...all);
  if(t1-t0<30*60000) t0=t1-30*60000;
  const N=7, W=320, H=150, L=6, R=314, T=14, B=118;
  const ts=Array.from({length:N},(_,i)=>t0+(t1-t0)*i/(N-1));
  const s1=ts.map(t=>ins.filter(x=>x<=t).length), s2=ts.map(t=>gs.filter(x=>x<=t).length);
  const max=Math.max(4,...s1,...s2);
  const X=i=>L+(R-L)*i/(N-1), Y=v=>B-(B-T)*v/max;
  const path=arr=>{const P=arr.map((v,i)=>[X(i),Y(v)]);let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
    for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,k=.18;
      d+=` C${(p1[0]+(p2[0]-p0[0])*k).toFixed(1)},${(p1[1]+(p2[1]-p0[1])*k).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*k).toFixed(1)},${(p2[1]-(p3[1]-p1[1])*k).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
    return d};
  const grid=[0,.5,1].map(f=>`<line class="grid" x1="${L}" x2="${R}" y1="${(T+(B-T)*f).toFixed(1)}" y2="${(T+(B-T)*f).toFixed(1)}"/>`).join("");
  const lab=ts.map((t,i)=>i%2?"":`<text class="axis day" x="${X(i)}" y="${B+20}" text-anchor="${i===0?"start":i===N-1?"end":"middle"}">${new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</text>`).join("");
  const li=N-1, px=X(li), py=Y(s1[li]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s1[li]} check-ins and ${s2[li]} finished games so far">
    ${grid}<line class="vline" x1="${px}" x2="${px}" y1="${T}" y2="${B}"/>
    <path class="l1" d="${path(s1)}"/><path class="l2" d="${path(s2)}"/>
    <circle class="pt" cx="${px}" cy="${py}" r="5"/>${lab}</svg>
    <div class="tip ${py<T+(B-T)*.45?"below":""}" style="left:${(px/W*100).toFixed(1)}%;top:${(py/H*100).toFixed(1)}%"><span>As of ${fmtClock(new Date(t1).toISOString())}</span>Checked in: ${s1[li]}<br>Games done: ${s2[li]}</div></div>`;
}

async function generate(){
  const e=ev(),cat=$("#g-cat").value,lvl=$("#g-lvl").value,inOnly=$("#g-in").checked,msg=$("#genMsg");
  ls.set("gen",{cat,lvl,inOnly});
  const taken=new Set(live().map(m=>m.court)),b=busy(),free=[];
  for(let c=1;c<=e.courts;c++)if(!taken.has(c))free.push(c);
  if(!free.length){msg.textContent="Every court is in play. Record a result to free one up.";return}
  const gp=gamesPlayed();
  const pool=S.players.filter(p=>!b.has(p.id)&&(!inOnly||p.checkedIn)&&(lvl==="any"||p.level===lvl));
  const order=a=>shuffle(a).sort((x,y)=>(gp[x.id]||0)-(gp[y.id]||0));
  const made=[];
  if(cat==="mixed"){const M=order(pool.filter(p=>p.gender==="M")),W=order(pool.filter(p=>p.gender==="F"));
    const k=Math.min(free.length,Math.floor(M.length/2),Math.floor(W.length/2));
    for(let i=0;i<k;i++){const m=shuffle(M.splice(0,2)),w=shuffle(W.splice(0,2));made.push({teamA:[m[0].id,w[0].id],teamB:[m[1].id,w[1].id]})}}
  else{const L=order(pool.filter(p=>p.gender===(cat==="mens"?"M":"F")));const k=Math.min(free.length,Math.floor(L.length/4));
    for(let i=0;i<k;i++){const f=shuffle(L.splice(0,4));made.push({teamA:[f[0].id,f[1].id],teamB:[f[2].id,f[3].id]})}}
  if(!made.length){msg.textContent=`Not enough free players for ${CATS[cat].toLowerCase()} at ${LEVELS[lvl].toLowerCase()} level. ${cat==="mixed"?"Mixed needs 2 men and 2 women per court.":"Each court needs 4 players."}`;return}
  const round=Math.max(0,...S.matches.map(m=>m.round||0))+1,now=new Date().toISOString();
  msg.textContent="Assigning…";
  try{for(let i=0;i<made.length;i++) await evCol("matches").doc(uid()).set({...made[i],category:cat,level:lvl,court:free[i],round,status:"live",createdAt:now});
    msg.textContent=`Round ${round}: ${made.length} ${made.length===1?"game":"games"} on court${made.length>1?"s":""} ${free.slice(0,made.length).join(", ")}.`}
  catch(err){msg.textContent="Couldn't save matchups. Only admins can set them."}
}

const TROPHY=`<svg viewBox="0 0 64 80" aria-hidden="true"><circle cx="32" cy="12" r="9" fill="#f6b90a" stroke="#111" stroke-width="2.5"/><g fill="#111"><circle cx="29" cy="9" r="1.6"/><circle cx="35" cy="10" r="1.6"/><circle cx="31" cy="15" r="1.6"/></g><path d="M16 22h32v14a16 16 0 0 1-32 0z" fill="#f6b90a" stroke="#111" stroke-width="3"/><path d="M16 26H7v4a10 10 0 0 0 11 10M48 26h9v4a10 10 0 0 1-11 10" fill="none" stroke="#111" stroke-width="3"/><path d="M28 51h8v11h-8z" fill="#111"/><rect x="18" y="62" width="28" height="7" fill="#f6b90a" stroke="#111" stroke-width="3"/><rect x="13" y="69" width="38" height="9" fill="#111"/></svg>`;
const PLAN={
  4:[{id:"s1",r:"Semifinal",short:"SF1",a:{seed:1},b:{seed:4}},{id:"s2",r:"Semifinal",short:"SF2",a:{seed:2},b:{seed:3}},
     {id:"f",r:"Championship",short:"Final",a:{w:"s1"},b:{w:"s2"}},{id:"b",r:"Battle for bronze",short:"Bronze",a:{l:"s1"},b:{l:"s2"}}],
  8:[{id:"q1",r:"Quarterfinal",short:"QF1",a:{seed:1},b:{seed:8}},{id:"q2",r:"Quarterfinal",short:"QF2",a:{seed:4},b:{seed:5}},
     {id:"q3",r:"Quarterfinal",short:"QF3",a:{seed:3},b:{seed:6}},{id:"q4",r:"Quarterfinal",short:"QF4",a:{seed:2},b:{seed:7}},
     {id:"s1",r:"Semifinal",short:"SF1",a:{w:"q1"},b:{w:"q2"}},{id:"s2",r:"Semifinal",short:"SF2",a:{w:"q3"},b:{w:"q4"}},
     {id:"f",r:"Championship",short:"Final",a:{w:"s1"},b:{w:"s2"}},{id:"b",r:"Battle for bronze",short:"Bronze",a:{l:"s1"},b:{l:"s2"}}]

const planOf=br=>br.plan||PLAN[br.size]||PLAN[4];

function normBr(d){return {...d,teams:(d.teams||[]).map(t=>Array.isArray(t)?t:[t.a,t.b]),res:d.res||{},live:d.live||{}}}
function bSide(br,ref){
  if(ref.team!=null) return ref.team; if(ref.ph) return null;
  if(ref.seed) return ref.seed-1<br.teams.length?ref.seed-1:null;
  const src=ref.w||ref.l, r=br.res[src]; if(!r) return null;
  const m=bMatch(br,src); if(m.a==null||m.b==null) return null;
  const win=r.w==="a"?m.a:m.b, lose=r.w==="a"?m.b:m.a; return ref.w?win:lose;
}
function bMatch(br,id){const p=pmOf(br,id);return {...p,ra:p.a,rb:p.b,a:bSide(br,p.a),b:bSide(br,p.b),res:br.res[id]||null,live:br.live[id]||null}}
const tName=(br,i)=>i==null?"":br.teams[i].map(first).join(" & ");
const refLabel=(br,ref)=>ref.ph?ref.ph:`${ref.w?"Winner":"Loser"} of ${pmOf(br,ref.w||ref.l)?.short||"?"}`;
function podium(br){if(!pmOf(br,"f"))return null;const f=bMatch(br,"f"),b=pmOf(br,"b")?bMatch(br,"b"):null;if(!f.res)return null;
  return {gold:f.res.w==="a"?f.a:f.b,silver:f.res.w==="a"?f.b:f.a,bronze:b&&b.res?(b.res.w==="a"?b.a:b.b):null}}
const downstream=(br,id)=>planOf(br).filter(p=>(p.a.w||p.a.l)===id||(p.b.w||p.b.l)===id).map(p=>p.id);
const canUndo=(br,id)=>downstream(br,id).every(d=>!br.res[d]&&!br.live[d]);
const myTeamIn=(br,pid)=>br.teams.findIndex(t=>t.includes(pid));
const brList=()=>[...divBrackets(),...[...(S.brackets||[])].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""))];

function eligible(cat,lvl,inOnly){return S.players.filter(p=>(!inOnly||p.checkedIn)&&(lvl==="any"||p.level===lvl)&&(cat==="mens"?p.gender==="M":cat==="womens"?p.gender==="F":true))}
function rankPlayers(list){const {w}=standings(),g=gamesPlayed();return [...list].sort((a,b)=>(w[b.id]||0)-(w[a.id]||0)||((g[a.id]||0)-(w[a.id]||0))-((g[b.id]||0)-(w[b.id]||0))||a.name.localeCompare(b.name))}

function readBkCfg(){const c={cat:$("#bk-cat")?.value||"mixed",lvl:$("#bk-lvl")?.value||"any",size:+($("#bk-size")?.value||4),pair:$("#bk-pair")?.value||"balanced",inOnly:!!$("#bk-in")?.checked};S.bkCfg=c;return c}
function buildDraft(){
  const c=readBkCfg(), N=c.size, pool=eligible(c.cat,c.lvl,c.inOnly), {w}=standings(); let teams=[];
  if(c.cat==="mixed"){const M=rankPlayers(pool.filter(p=>p.gender==="M")),W=rankPlayers(pool.filter(p=>p.gender==="F"));
    if(M.length<N||W.length<N){toast(`Mixed with ${N} teams needs ${N} men and ${N} women. Found ${M.length} and ${W.length}.`);return}
    for(let i=0;i<N;i++) teams.push([M[i].id,(c.pair==="top"?W[i]:W[N-1-i]).id]);}
  else{const P=rankPlayers(pool);
    if(P.length<2*N){toast(`${N} teams needs ${2*N} players. Found ${P.length}.`);return}
    for(let i=0;i<N;i++) teams.push(c.pair==="top"?[P[2*i].id,P[2*i+1].id]:[P[i].id,P[2*N-1-i].id]);}
  const tw=t=>(w[t[0]]||0)+(w[t[1]]||0); teams=teams.map((t,i)=>[t,i]).sort((x,y)=>tw(y[0])-tw(x[0])||x[1]-y[1]).map(x=>x[0]);
  S.bkDraft={...c,teams}; render();
}

}
async function bkSendCourt(id){

    await saveBr(br,{live:{...br.live,[id]:{court,match:mid}}});toast(`${m.short} is on Court ${court}. The players just got an alert.`)}

async function recordPlayoff(brId,id,w,sa,sb){
  const br=(S.brackets||[]).find(b=>b.id===brId); if(!br) return false;
  const m=bMatch(br,id); if(m.a==null||m.b==null||m.res) return false;
  if(sa!=null&&sb!=null&&((w==="a"&&sa<sb)||(w==="b"&&sb<sa))){toast("That score says the other team won. Check the numbers.");return false}
  const now=new Date().toISOString(), W=w==="a"?"A":"B"; let mid=m.live?.match;
  try{
    if(mid) await evCol("matches").doc(mid).update({status:"done",winner:W,scoreA:sa,scoreB:sb,endedAt:now});
    else{mid=uid();await evCol("matches").doc(mid).set({teamA:br.teams[m.a],teamB:br.teams[m.b],category:br.category,level:br.level,court:null,round:0,status:"done",winner:W,scoreA:sa,scoreB:sb,createdAt:now,endedAt:now,playoff:{b:br.id,m:id,label:m.short}})}
    const lv={...br.live}; delete lv[id];
    await saveBr(br,{res:{...br.res,[id]:{w,sa,sb,at:now,match:mid}},live:lv});
    return true;
  }catch(e){toast("Couldn't save the result. Only admins can.");return false}
}

/* ---------- Schedule import: parser (pure functions) ---------- */
const IMP_SKIP=/open\s*(for\s*)?play|warm\s*-?\s*up|^break$|^lunch$|^reserved$/i;
const nameKey=n=>String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function impTime(v){
  const s=String(v??"").trim(); if(!s) return null;
  const re=/(\d{1,2})[:.](\d{2})\s*(am|pm)?/gi; const t=[...s.matchAll(re)]; if(!t.length) return null;
  const fix=m=>{let h=+m[1];const ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(!ap&&h<7)h+=12;return String(h).padStart(2,"0")+":"+m[2]};
  const start=fix(t[0]); let end=t[1]?fix(t[1]):null;
  if(!end){const [h,mi]=start.split(":").map(Number);const d=h*60+mi+15;end=String(Math.floor(d/60)).padStart(2,"0")+":"+String(d%60).padStart(2,"0")}
  return {start,end};
}
function impDiv(t){
  const s=" "+String(t||"").replace(/\s+/g," ")+" ";
  const cat=/wom[ae]n|\bWD\b|ladies|\bWDs?\b/i.test(s)?"womens":/mix/i.test(s)?"mixed":/\bmen|\bMD\b|\bmens\b/i.test(s)?"mens":null;
  const level=/high\s*interm/i.test(s)?"High Intermediate":/low\s*interm/i.test(s)?"Low Intermediate":/interm/i.test(s)?"Intermediate":/novice|beginner/i.test(s)?"Novice":/advanced/i.test(s)?"Advanced":"Open";
  return {cat,level};
}
const impNames=s=>String(s||"").split("/").map(n=>n.replace(/\s+/g," ").trim()).filter(Boolean);
function impCell(txt){
  const lines=String(txt).split(/\r?\n+/).map(x=>x.trim()).filter(Boolean);
  const isVs=l=>/\/.*\s+vs\.?\s+.*\//i.test(l);
  const vsLine=[...lines].reverse().find(isVs);
  if(vsLine){
    const head=lines.filter(l=>l!==vsLine).join(" ");
    const [A,B]=vsLine.split(/\s+vs\.?\s+/i);
    return {kind:"pool",div:impDiv(head||vsLine),pool:((head.match(/pool\s+([A-H])\b/i)||[])[1]||"").toUpperCase()||null,A:impNames(A),B:impNames(B)};
  }
  const all=lines.join(" ");
  const stage=/gold/i.test(all)?"gold":/bronze/i.test(all)?"bronze":/\bsemi/i.test(all)?"sf":/\bQF\s*\d/i.test(all)?"qf":/\bfinal/i.test(all)?"gold":null;
  if(!stage) return {kind:"unknown"};
  let qf=null, body=all;
  if(stage==="qf"){const m=all.match(/\bQF\s*(\d)\s*:?/i);qf=m?+m[1]:null;body=m?all.slice(m.index+m[0].length):all}
  const toks=[...body.matchAll(/\b(QF\s*\d|[A-H][1-4])\b/gi)].map(m=>m[1].replace(/\s+/g,"").toUpperCase());
  const top=all.match(/top\s*(\d)\s*(?:&|and|,|vs)\s*(\d)/i);
  return {kind:"po",div:impDiv(all),stage,qf,toks,top:top?[+top[1],+top[2]]:null};
}
function impFindHeader(rows){return rows.findIndex(r=>Array.isArray(r)&&r.filter(c=>/court/i.test(String(c??""))).length>=2)}

  if(hi<0) throw new Error("Couldn't find a header row with court columns (like “Court 1”, “Court 2”).");
  const head=rows[hi], cols=[], courtNames={};
  head.forEach((h,ci)=>{const m=String(h??"").match(/court\s*#?\s*(\d+)/i);if(m){cols.push({ci,court:+m[1]});const extra=String(h).replace(/court\s*#?\s*\d+/i,"").trim();if(extra)courtNames[+m[1]]=extra}});
  let tc=head.findIndex(h=>/time/i.test(String(h??""))); if(tc<0) tc=0;
  const divs=new Map(), players=new Map(), slots=[];
  const getDiv=d=>{const key=(d.cat||"?")+"|"+d.level;if(!divs.has(key))divs.set(key,{key,cat:d.cat,level:d.level,teams:new Map(),pools:new Set(),games:[],po:[]});return divs.get(key)};
  const addPlayer=n=>{const k=nameKey(n);if(!k)return null;if(!players.has(k))players.set(k,{key:k,variants:{},g:{}});const p=players.get(k);p.variants[n]=(p.variants[n]||0)+1;return k};
  const addTeam=(dv,names,pool)=>{const ks=names.map(addPlayer).filter(Boolean);const key=[...ks].sort().join("+");if(!dv.teams.has(key))dv.teams.set(key,{key,players:ks,label:names.join("/"),pool:pool||null,count:0});const t=dv.teams.get(key);t.count++;if(pool&&!t.pool)t.pool=pool;return key};
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[]; const tm=impTime(row[tc]); if(!tm) continue;
    const slot=slots.length; slots.push(tm);
    for(const {ci,court} of cols){
      const v=row[ci]; if(v==null) continue; const txt=String(v).trim(); if(!txt||IMP_SKIP.test(txt.split(/\n/)[0].trim())&&!/\bvs\b/i.test(txt)) continue;
      const c=impCell(txt), at={slot,time:tm.start,end:tm.end,court};
      if(c.kind==="unknown"){warnings.push(`Skipped ${tm.start} Court ${court}: “${txt.replace(/\s+/g," ").slice(0,60)}”`);continue}
      if(!c.div.cat){warnings.push(`Couldn't tell the division for ${tm.start} Court ${court}: “${txt.replace(/\s+/g," ").slice(0,60)}”`);continue}
      const dv=getDiv(c.div);
      if(c.kind==="pool"){
        if(c.A.length!==2||c.B.length!==2){warnings.push(`${tm.start} Court ${court}: expected two players per team in “${txt.replace(/\s+/g," ").slice(0,60)}”`);continue}
        if(c.pool) dv.pools.add(c.pool);
        dv.games.push({...at,pool:c.pool,ta:addTeam(dv,c.A,c.pool),tb:addTeam(dv,c.B,c.pool)});
      } else dv.po.push({...at,...c});
    }
  }
  // merge near-duplicate teams (typos like "Rickys/Victor")
  for(const dv of divs.values()){
    const list=[...dv.teams.values()].sort((a,b)=>b.count-a.count);
    for(const t of [...list].reverse()){
      const m=list.find(o=>o!==t&&!o.mergedInto&&o.count>=t.count&&(o.pool===t.pool||!o.pool||!t.pool)&&t.players.some(k=>o.players.includes(k))&&(()=>{const a=t.players.find(k=>!o.players.includes(k)),b=o.players.find(k=>!t.players.includes(k));return a&&b&&lev(a,b)<=2})());
      if(m&&!t.mergedInto){t.mergedInto=m.key;warnings.push(`Treated “${t.label}” as “${m.label}” (${dv.level} ${dv.cat}) — looks like a typo.`)}
    }
    const fin=k=>{let t=dv.teams.get(k);while(t.mergedInto)t=dv.teams.get(t.mergedInto);return t.key};
    dv.games.forEach(g=>{g.ta=fin(g.ta);g.tb=fin(g.tb)});
    for(const t of [...dv.teams.values()]) if(t.mergedInto) dv.teams.delete(t.key);
  }
  // genders
  for(const dv of divs.values()) for(const t of dv.teams.values()) for(const k of t.players){const p=players.get(k);if(dv.cat==="womens")p.g.F=1;if(dv.cat==="mens")p.g.M=1}
  for(let pass=0;pass<3;pass++) for(const dv of divs.values()) if(dv.cat==="mixed") for(const t of dv.teams.values()){
    const [a,b]=t.players.map(k=>players.get(k)), ga=gOf(a), gb=gOf(b);
    if(ga&&!gb) b.g[ga==="M"?"F":"M"]=1; if(gb&&!ga) a.g[gb==="M"?"F":"M"]=1;
  }
  function gOf(p){return p.g.M&&!p.g.F?"M":p.g.F&&!p.g.M?"F":null}
  const usedKeys=new Set(); for(const dv of divs.values()) for(const t of dv.teams.values()) t.players.forEach(k=>usedKeys.add(k));
  const outPlayers=[...players.values()].filter(p=>usedKeys.has(p.key)).map(p=>{
    const name=Object.entries(p.variants).sort((a,b)=>b[1]-a[1])[0][0];
    if(p.g.M&&p.g.F) warnings.push(`“${name}” plays in both men's and women's divisions. Check if these are two different people.`);
    return {key:p.key,name,gender:gOf(p)||""}});
  // divisions + playoffs
  const order={womens:0,mens:1,mixed:2}, lvlOrder=["Novice","Low Intermediate","Intermediate","High Intermediate","Advanced","Open"];
  const outDivs=[], outSched=[]; let di=0;
  const sorted=[...divs.values()].sort((a,b)=>(order[a.cat]-order[b.cat])||(lvlOrder.indexOf(a.level)-lvlOrder.indexOf(b.level)));
  for(const dv of sorted){
    const id="d"+(++di), teams=[...dv.teams.values()].map((t,i)=>({id:id+"t"+(i+1),key:t.key,players:t.players,pool:t.pool,label:t.label}));
    const tid=k=>teams.find(t=>t.key===k).id;
    if(!teams.length){warnings.push(`${dv.level} ${dv.cat}: playoff games found but no teams, skipped.`);continue}
    const pools=[...dv.pools].sort();
    outDivs.push({id,cat:dv.cat,level:dv.level,pools,teams:teams.map(({key,...t})=>t)});
    dv.games.forEach((g,i)=>outSched.push({id:id+"g"+(i+1),div:id,stage:"pool",key:null,pool:g.pool,slot:g.slot,time:g.time,end:g.end,court:g.court,a:{t:tid(g.ta)},b:{t:tid(g.tb)},label:g.pool?`Pool ${g.pool}`:"Round robin"}));
    const po=dv.po, hasQF=po.some(p=>p.stage==="qf"), sfs=po.filter(p=>p.stage==="sf");
    const pref=tok=>/^QF/.test(tok)?{w:"q"+tok.slice(2)}:{pool:tok[0],rank:+tok[1]};
    po.filter(p=>p.stage==="qf").forEach(p=>{const k="q"+(p.qf||1);if(p.toks.length<2){warnings.push(`${p.time} Court ${p.court}: couldn't read the quarterfinal matchup.`);return}
      outSched.push({id:id+k,div:id,stage:"qf",key:k,slot:p.slot,time:p.time,end:p.end,court:p.court,a:pref(p.toks[0]),b:pref(p.toks[1]),label:"QF"+(p.qf||1)})});
    const sfSorted=[...sfs].sort((x,y)=>(x.toks.some(t=>t==="QF1"||t==="A1")?-1:0)-(y.toks.some(t=>t==="QF1"||t==="A1")?-1:0));
    sfSorted.slice(0,2).forEach((p,i)=>{const k="s"+(i+1);if(p.toks.length<2){warnings.push(`${p.time} Court ${p.court}: couldn't read the semifinal matchup.`);return}
      outSched.push({id:id+k,div:id,stage:"sf",key:k,slot:p.slot,time:p.time,end:p.end,court:p.court,a:pref(p.toks[0]),b:pref(p.toks[1]),label:"SF"+(i+1)})});
    const hasSF=sfSorted.length>=2;
    po.filter(p=>p.stage==="gold").slice(0,1).forEach(p=>outSched.push({id:id+"f",div:id,stage:"gold",key:"f",slot:p.slot,time:p.time,end:p.end,court:p.court,
      a:hasSF?{w:"s1"}:{rank:p.top?p.top[0]:1},b:hasSF?{w:"s2"}:{rank:p.top?p.top[1]:2},label:"Gold"}));
    po.filter(p=>p.stage==="bronze").slice(0,1).forEach(p=>outSched.push({id:id+"b",div:id,stage:"bronze",key:"b",slot:p.slot,time:p.time,end:p.end,court:p.court,
      a:hasSF?{l:"s1"}:{rank:p.top?p.top[0]:3},b:hasSF?{l:"s2"}:{rank:p.top?p.top[1]:4},label:"Bronze"}));
    if(hasQF&&sfs.length<2) warnings.push(`${dv.level} ${dv.cat}: has quarterfinals but not two semifinals.`);
  }
  const courts=Math.max(0,...cols.map(c=>c.court));
  return {players:outPlayers,divs:outDivs,sched:outSched,warnings,courts,courtNames,start:slots[0]?.start||null,end:slots.at(-1)?.end||null,slots:slots.length};
}

function normDiv(d){return {...d,pools:d.pools||[],teams:(d.teams||[]).map(t=>({...t,players:[t.a,t.b]}))}}
function poolTable(d,pool){
  const teams=d.teams.filter(t=>pool==null||t.pool===pool);
  const games=(S.sched||[]).filter(x=>x.div===d.id&&x.stage==="pool"&&(pool==null||x.pool===pool));
  const row=Object.fromEntries(teams.map(t=>[t.id,{t,w:0,l:0,pf:0,pa:0}]));
  for(const g of games){ if(!g.res) continue; const a=row[g.a?.t],b=row[g.b?.t]; if(!a||!b) continue;
    const aw=g.res.w==="a"; (aw?a:b).w++; (aw?b:a).l++;

  const rows=Object.values(row).sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf||teamName(x.t).localeCompare(teamName(y.t)));

    const A=resolveRef(d,x.a),B=resolveRef(d,x.b);if(!A||!B)return null;const win=x.res.w==="a"?A:B,lose=x.res.w==="a"?B:A;return ref.w?win:lose}

function refText(ref){if(!ref)return "TBD";if(ref.pool)return `Pool ${ref.pool} #${ref.rank}`;if(ref.rank)return `#${ref.rank} in standings`;if(ref.w)return `Winner of ${keyLabel(ref.w)}`;if(ref.l)return `Loser of ${keyLabel(ref.l)}`;return "TBD"}

  const STG={qf:"Quarterfinal",sf:"Semifinal",gold:"Battle for gold",bronze:"Battle for bronze"};

async function startSched(sid,court){

async function loadXLSX(){
  if(window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("Couldn't load the spreadsheet reader. Check your connection and try again."));document.head.appendChild(s)});
  return window.XLSX;
}
async function impFile(file){
  if(!file) return;
  S.imp={busy:true,msg:"Reading the file…"};refreshImp();
  try{
    const XLSX=await loadXLSX(), wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    let rows=null;for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:null,blankrows:false});if(impFindHeader(r)>=0){rows=r;break}}
    if(!rows) throw new Error("Couldn't find a sheet with court columns (like “Court 1”, “Court 2”).");
    const p=parseSchedule(rows); if(!p.sched.length) throw new Error("No games found in this file.");
    const title=file.name.replace(/\.(xlsx|xls|csv)$/i,"").replace(/[_-]+/g," ").replace(/\b(tournament\s+schedule|final|schedule)\b/gi,"").replace(/\s+/g," ").trim();
    S.imp={parsed:p,fileName:file.name,title,opts:{updateEvent:true,replace:true}};
  }catch(e){S.imp={error:e.message||"Couldn't read that file."}}
  refreshImp();
}

async function runChunks(tasks,label){
  let done=0;
  for(let i=0;i<tasks.length;i+=8){await Promise.all(tasks.slice(i,i+8).map(f=>f()));done=Math.min(tasks.length,i+8);S.imp.msg=`${label} ${done} of ${tasks.length}…`;refreshImp()}
}
async function impRun(){
  const I=S.imp, p=I.parsed; if(!p) return;
  S.imp={...I,busy:true,msg:"Getting ready…"};refreshImp();
  try{
    const now=new Date().toISOString(), pre=uid(4)+"-";
    if(I.opts.replace&&(S.sched||[]).length){
      const del=[];(S.sched||[]).forEach(x=>{del.push(()=>schedCol().doc(x.id).delete());if(x.live?.match)del.push(()=>evCol("matches").doc(x.live.match).update({status:"void"}).catch(()=>{}))});
      (S.divs||[]).forEach(d=>del.push(()=>divCol().doc(d.id).delete()));
      await runChunks(del,"Clearing old schedule");
    }
    const byKey={};(S.roster||[]).forEach(r=>{byKey[nameKey(r.name)]=r.id});
    const addP=[];
    for(const x of p.players){ if(byKey[x.key]){const r=S.roster.find(r=>r.id===byKey[x.key]);if(r&&!r.gender&&x.gender)addP.push(()=>rosterCol().doc(r.id).update({gender:x.gender}));continue}
      const id=uid();byKey[x.key]=id;const d=p.divs.find(d=>d.teams.some(t=>t.players.includes(x.key)));
      addP.push(()=>rosterCol().doc(id).set({name:x.name,gender:x.gender,level:lvlKey(d?.level),checkedIn:false,imported:true,createdAt:now}))}
    await runChunks(addP,"Adding players");
    const divW=p.divs.map((d,i)=>()=>divCol().doc(pre+d.id).set({cat:d.cat,level:d.level,pools:d.pools,order:i,teams:d.teams.map(t=>({id:pre+t.id,a:byKey[t.players[0]],b:byKey[t.players[1]],pool:t.pool||null})),createdAt:now}));
    await runChunks(divW,"Saving divisions");
    const mapRef=r=>r.t?{t:pre+r.t}:r;
    const sW=p.sched.map(x=>()=>schedCol().doc(pre+x.id).set({div:pre+x.div,stage:x.stage,key:x.key||null,pool:x.pool||null,slot:x.slot,time:x.time,end:x.end,court:x.court,a:mapRef(x.a),b:mapRef(x.b),label:x.label,res:null,live:null}));
    await runChunks(sW,"Saving games");
    if(I.opts.updateEvent){const e=ev();await S.db.doc("events/"+S.eventId).update({name:I.title||e.name,courts:Math.max(p.courts,1),start:p.start||e.start,end:p.end||e.end,courtNames:p.courtNames||{}})}
    S.imp=null;S.cview="schedule";S.tab="courts";render();window.scrollTo(0,0);toast(`Imported ${p.sched.length} games and ${p.players.length} players`);
  }catch(e){S.imp={...I,busy:false,error:"The import stopped partway. Only admins can import. Try again, and keep “Replace” ticked."};refreshImp()}
}

function chime(){
  if(!alertPrefs().sound) return;
  try{primeAudio();const c=AL.ctx;if(!c||c.state!=="running")return;const t0=c.currentTime;
    [[880,0],[1175,.18],[1568,.36],[880,.8],[1175,.98],[1568,1.16]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.32);o.connect(g).connect(c.destination);o.start(t0+d);o.stop(t0+d+.35)})}catch(e){}
}

function checkUpNext(){
  const m=me(), box=$("#upnext");
  if(!m||isAdminView()||!S.eventId||!S.loaded.matches||!box.hidden) return !box.hidden;
  const key="up."+S.eventId+"."+m.id, seen=ls.get(key,[]);
  const mineLive=live().filter(x=>x.court&&[...x.teamA,...x.teamB].includes(m.id)&&!seen.includes(x.id));
  if(!mineLive.length) return false;
  return showUpNext(mineLive[0],false);
}
function checkCelebrate(){
  if(checkUpNext()) return;
  const m=me(); const box=$("#celebrate");
  if(!m||isAdminView()||!S.eventId||!box.hidden||!S.loaded.matches||!S.loaded.kudos) return;
  const key="seen."+S.eventId+"."+m.id;
  const wins=done().filter(x=>x.winner&&(x.winner==="A"?x.teamA:x.teamB).includes(m.id));
  const kd=S.kudos.filter(k=>k.to===m.id);
  if(!S.loaded.brackets) return;
  const medals=[];for(const br of brList()){const ti=myTeamIn(br,m.id);if(ti<0)continue;const p=podium(br);if(!p)continue;const pl=p.gold===ti?1:p.silver===ti?2:p.bronze===ti?3:0;if(pl)medals.push({k:br.id+":"+pl,pl,br,ti})}
  const seen=ls.get(key,null);
  ls.set(key,{m:wins.map(x=>x.id),k:kd.map(k=>k.id),p:medals.map(x=>x.k)});
  if(!seen) return;
  const newP=medals.filter(x=>!(seen.p||[]).includes(x.k));
  const newW=wins.filter(x=>!seen.m.includes(x.id)), newK=kd.filter(k=>!seen.k.includes(k.id));
  if(!newP.length&&!newW.length&&!newK.length) return;
  let big,title,text,extra="";
  if(newP.length){const x=newP[0];big=["","🥇","🥈","🥉"][x.pl];title=["","Champions!","Runner-up!","Bronze medal!"][x.pl];
    text=`${esc(x.br.name)} · with ${esc(pName(x.br.teams[x.ti].find(id=>id!==m.id)))}`;extra=`<button class="btn" data-act="cele-go" data-tab="bracket">See the bracket</button>`;}
  else if(newW.length){
    const w=newW[0], team=w.winner==="A"?w.teamA:w.teamB, partner=team.find(x=>x!==m.id);
    const sc=w.scoreA!=null&&w.scoreB!=null?` · ${Math.max(w.scoreA,w.scoreB)}–${Math.min(w.scoreA,w.scoreB)}`:"";
    big=ic("trophy");title=w.court?`You won on Court ${w.court}!`:`You won ${w.playoff?.label||"your match"}!`;text=`With ${esc(pName(partner))}${sc}`;
    extra=`<button class="btn" data-act="cele-go" data-tab="results">See results</button>`;
  } else {
    const rx=reactionsOf(), byId=Object.fromEntries(rx.map(r=>[r.id,r]));
    const valid=newK.filter(k=>byId[k.r]); if(!valid.length) return;
    if(valid.length===1){const k=valid[0],r=byId[k.r];big=esc(r.emoji);title=esc(r.label)+"!";text=`${esc(pName(k.from))} just gave you ${esc(r.emoji)}`}
    else{big=esc(byId[valid[0].r].emoji);title=`${valid.length} new reactions`;text=`<span class="emojis">${valid.map(k=>esc(byId[k.r].emoji)).join(" ")}</span><br>from ${esc([...new Set(valid.map(k=>pName(k.from).split(" ")[0]))].slice(0,3).join(", "))}`}
  }
  const colors=["#121212","#ffffff","#f6b90a","#121212","#ffffff"];
  const conf=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:${colors[i%5]};animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`).join("");
  box.innerHTML=`<div class="confetti" aria-hidden="true">${conf}</div><div class="inner"><div class="big" aria-hidden="true">${big}</div><h1 id="celeTitle">${title}</h1><p>${text}</p>
    <div class="row" style="justify-content:center"><button class="btn dark" data-act="cele-close">Nice!</button>${extra}</div></div>`;
  box.hidden=false;
}

async function shrink(file){try{const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85))}catch(e){return file}}
async function uploadPhotos(files){
  const who=$("#ph-who").value,msg=$("#ph-msg");
  if(!who){msg.textContent="Pick a player first.";return}
  const left=5-S.photos.filter(p=>p.playerId===who).length;
  const take=[...files].filter(f=>f.type.startsWith("image/")).slice(0,left);
  if(!take.length){msg.textContent=left<=0?"All 5 photos are used.":"Those files aren't images.";return}
  let ok=0;
  for(const f of take){msg.textContent=`Uploading ${ok+1} of ${take.length}…`;
    try{const r=await S.assets.upload(await shrink(f));await galleryCol().doc(uid()).set({assetId:r.id,url:r.url,playerId:who,uploaderUid:S.uid||null,createdAt:new Date().toISOString()});ok++}
    catch(err){msg.textContent=`Photo ${ok+1} didn't upload (${err?.code||"error"}). Try a smaller image.`;return}}
  msg.textContent=`Added ${ok} ${ok===1?"photo":"photos"}.`+(files.length>left?` Only ${left} ${left===1?"slot was":"slots were"} left.`:"");
}
